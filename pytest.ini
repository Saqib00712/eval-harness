[pytest]
norecursedirs = _backup_before_* .venv venv .git
# Lets `eval_harness` (and `scripts`) import cleanly whether pytest is
# invoked as `pytest` or `python -m pytest` -- see docs/day2.md.
pythonpath = .
# SystemUnderTest.run() is async (Day 3) -- let `async def test_...`
# functions run directly without an `@pytest.mark.asyncio` on every one.
asyncio_mode = auto
